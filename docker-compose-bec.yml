services:
  sdr-water-meter:
    build:
      context: .
      dockerfile: Dockerfile.rtl433
    devices:
      - "/dev/bus/usb"
    depends_on:
      - sdr_relay
    restart: always
    environment:
      - DEVICE_ID=0
      - DEVICE_PROTOS=228
      - FREQ=912600155
  sdr_relay:
    build:
      context: .
      dockerfile: Dockerfile.graphite_relay
    restart: always
    ports:
      - "1433:1433"
    environment:
      - GRAPHITE_HOST=${GRAPHITE_HOST}
      - GRAPHITE_PORT=${GRAPHITE_PORT}
      - GRAPHITE_PREFIX=${GRAPHITE_PREFIX}
